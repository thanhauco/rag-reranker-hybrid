# Hybrid retrieval -> cross-encoder -> Claude listwise rerank -> Claude answer with citations.
# Needs: pip install -e ".[models,llm]" and Claude credentials (ANTHROPIC_API_KEY or `ant auth login`).
retriever:
  type: hybrid
  fusion: rrf
  candidate_k: 100
  components:
    bm25: {type: bm25}
    dense:
      type: dense
      embedder: {type: st, model_name: BAAI/bge-small-en-v1.5}
reranker:
  type: cascade
  stages:
    - {type: cross_encoder, model_name: minilm, keep: 20}
    - {type: llm_listwise, model: claude-opus-5-5, effort: low, window_size: 20, step: 10, keep: 5}
generator:
  type: claude
  model: claude-opus-5-5
  effort: medium
pipeline:
  retrieve_k: 50
  rerank_k: 5
